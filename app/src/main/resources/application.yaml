spring:
  application:
    name: zbar-showtime-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  http:
    clients:
      read-timeout: 5s
  mvc:
    log-resolved-exception: true
logging:
  level:
    # Hibernate logs the failed statement, with the email and the password hash, at WARN on a
    # duplicate email. Only ERROR and above is kept.
    org.hibernate.orm.jdbc.error: ERROR
    fr.zbar: INFO
app:
  jwt:
    secret: ${JWT_SECRET}
  tmdb:
    base-url: https://api.themoviedb.org/3
    token: ${TMDB_API_TOKEN}
    image-base-url: https://image.tmdb.org/t/p
    poster-size: w342
    profile-size: w185
    still-size: w300
    language: fr-FR
