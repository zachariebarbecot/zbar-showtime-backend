databaseChangeLog:
- changeSet:
    id: 006-create-watchlist-series-table
    author: zbarbecot
    changes:
    - createTable:
        tableName: watchlist_series
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: watchlist_seriesPK
        - column:
            name: user_id
            type: UUID
            constraints:
              nullable: false
              foreignKeyName: FK_watchlist_series_user
              references: users(id)
        - column:
            name: tmdb_id
            type: BIGINT
            constraints:
              nullable: false
        - column:
            name: status
            type: VARCHAR(16)
            constraints:
              nullable: false
        - column:
            name: added_at
            type: TIMESTAMP(6) WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: watched_at
            type: TIMESTAMP(6) WITH TIME ZONE
    - addUniqueConstraint:
        tableName: watchlist_series
        columnNames: user_id, tmdb_id
        constraintName: UC_watchlist_series_user_tmdb
    - sql:
        sql: ALTER TABLE watchlist_series ADD CONSTRAINT CK_watchlist_series_status CHECK (status IN ('TO_WATCH', 'WATCHING', 'WATCHED', 'DROPPED'))
