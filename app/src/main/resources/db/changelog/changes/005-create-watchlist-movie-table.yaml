databaseChangeLog:
- changeSet:
    id: 005-create-watchlist-movie-table
    author: zbarbecot
    changes:
    - createTable:
        tableName: watchlist_movie
        columns:
        - column:
            name: id
            type: UUID
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: watchlist_moviePK
        - column:
            name: user_id
            type: UUID
            constraints:
              nullable: false
              foreignKeyName: FK_watchlist_movie_user
              references: users(id)
        - column:
            name: tmdb_id
            type: BIGINT
            constraints:
              nullable: false
        - column:
            name: status
            type: VARCHAR(16)
            constraints:
              nullable: false
        - column:
            name: added_at
            type: TIMESTAMP(6) WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: watched_at
            type: TIMESTAMP(6) WITH TIME ZONE
    - addUniqueConstraint:
        tableName: watchlist_movie
        columnNames: user_id, tmdb_id
        constraintName: UC_watchlist_movie_user_tmdb
    - sql:
        sql: ALTER TABLE watchlist_movie ADD CONSTRAINT CK_watchlist_movie_status CHECK (status IN ('TO_WATCH', 'WATCHED'))
